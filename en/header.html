<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 3.2 Final//EN">
<HTML>
<HEAD>
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">
<STYLE>
        * { box-sizing: border-box; }
        body { 
            margin: 15px 0; 
            padding: 0; 
            background-color: #E8ECEF; 
            font-family: "Verdana", "Arial", "Microsoft YaHei", "SimSun", sans-serif;
        }
        table { 
            border-collapse: collapse; 
        }
        td { 
            padding: 0; 
            word-wrap: break-word;
        }
        /* New rule for data tables to prevent text from touching the borders */
        table[border="1"] th, table[border="1"] td {
            padding: 4px 10px;
            line-height: 1.2; /* Tighten line height for tables */
        }
        th {
            text-align: left;
            font-weight: bold;
        }
        h2, h3, p, ul, li { 
            margin: 0; 
            padding: 0; 
            line-height: 1.5;
        }
        h2 { font-size: 24px; margin-bottom: 15px; }
        h3 { font-size: 18px; margin-top: 20px; margin-bottom: 10px; }
        p { margin-bottom: 15px; }
        ul { margin-left: 20px; margin-bottom: 15px; }
        .sidebar-content { padding: 12px; }
        .main-content { padding: 20px; }
    </STYLE>
</HEAD>
<BODY BGCOLOR="#9AA7B1" MARGINWIDTH="0" MARGINHEIGHT="0" LEFTMARGIN="0" TOPMARGIN="0">
<TABLE BORDER="0" CELLPADDING="0" CELLSPACING="0" WIDTH="100%" HEIGHT="100%">
<TR><TD COLSPAN="3" BGCOLOR="#9AA7B1" HEIGHT="80" ALIGN="CENTER" VALIGN="MIDDLE">
                    <FONT FACE="Verdana, Arial, sans-serif" SIZE="6" COLOR="#F0F0F0">
                        <B>Ekiz's homepage</B>
                    </FONT>
                </TD></TR>
</TABLE>
</BODY>
</HTML>
